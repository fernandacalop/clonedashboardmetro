<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feliz um ano, meu amor!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-header">
        <div class="user-info">
            <span class="username">crxnqvist</span>
            <img src="megaesfiha.jpeg" alt="Foto do usuário" class="user-avatar">
        </div>
    </header>
    <header class="xbox-menu">
    <nav class="menu-nav">
        <div class="menu-item active" data-slide="0">home</div>
        <div class="menu-item" data-slide="1">social</div>
        <div class="menu-item" data-slide="2">music</div>
        <div class="menu-item" data-slide="3">uma mensagem para você</div>
    </nav>
    </header>
    <main class="dashboard-grid">
  <div class="carousel-wrap">
    <div class="carousel-slides" id="slides">
      <!-- Slide 0: home -->
      <div class="carousel-slide">
        <div class="metro-container">
          <div class="metro-col-small">
            <div class="grid-item card-small">
                <img src="opentray.png" class="card-imagem-fixa">
                <div class="item-content">
                    <h3>Open Tray</h3>
                </div>
            </div>
            <div class="grid-item card-small" id="card-quickplay">
                <div class="card-carousel">
                    <img src="quickplay1.png" class="card-foto-2 active">
                    <img src="quickplay2.png" class="card-foto-2">
                </div>
                <div class="item-content">
                    <h3>Quickplay</h3>
                </div>
            </div>
        </div>

        <!-- Card grande central -->
        <div class="grid-item card-large" id="card-nos">
            <div class="card-carousel">
                <img src="foto1.jpeg" class="card-foto active">
                <img src="foto2.jpeg" class="card-foto">
                <img src="foto3.jpeg" class="card-foto">
                <img src="foto4.jpeg" class="card-foto">
            </div>
            <div class="item-content">
                <h3>top momentos mais ÉPICOS de teusobreira e fefacalop</h3>
            </div>
        </div>

        <!-- Coluna direita: 2 cards pequenos -->
        <div class="metro-col-small">
            <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>Xbox Basics</h3>
                </div>
            </div>
            <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>Check My Network</h3>
                </div>
            </div>
        </div>
        </div>
      </div>

      <!-- Slide 1: social -->
      <div class="carousel-slide">
        <div class="metro-container social-container">

          <div class="metro-col-small">
            <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>Friends</h3>
                </div>
            </div>
            <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>Social Apps</h3>
                </div>
            </div>
            <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>Sign In or Out</h3>
                </div>
            </div>
            </div>
            <div class="social-avatares">
                <img src="avatarmateus.png" class="xbox-avatar">
                <img src="avatarfernanda.png" class="xbox-avatar">
            </div>
        </div>
      </div>

      <!-- Slide 2: music -->
      <div class="carousel-slide">
        <div class="metro-container">
          <div class="metro-col-small">
            <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>jogos</h3>
                </div>
            </div>
            <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>conquistas</h3>
                </div>
            </div>
        </div>

        <!-- Card grande central -->
        <div class="grid-item card-large" style="background-color: #107c10;">
            <div class="item-content">
                <h3>em destaque</h3>
            </div>
        </div>
        </div>
      </div>

      <!-- Slide 3: uma mensagem para vc -->
      <div class="carousel-slide">
        <div class="metro-container">
          <div class="grid-item card-small" style="background-color: #1e7a1e;">
                <div class="item-content">
                    <h3>mensagemmmmmm</h3>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>
    <button class="arrow-btn right" onclick="changeSlide(1)">&#10095;</button>
    <button class="arrow-btn left" onclick="changeSlide(-1)">&#10094;</button>
</main>
<script src="script.js"></script>
</body>
</html>
